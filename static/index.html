<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工伤事故调查与纠正措施</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem;margin-right:.5rem}</style></head><body><h1>工伤事故调查与纠正措施</h1><p>记录工伤经过、伤害、现场和证人，维护调查、纠正措施、验证与关闭流程</p><p>严重度越高、伤害指数越大或未关闭措施越多，优先级越高；严重事故必须在4小时内启动调查。</p><p>区域停复工台账：现场负责人登记区域编号、停工原因和影响班次，严重/死亡事故默认停整片区域；安全员提交复工时，整改未关闭或区域内有未结事故将被退回并写明阻断项；复工后同区域再发事故或新增未关闭措施，原复工单自动作废、区域回到停工。</p><button onclick="loadItems()">刷新事故列表</button><button onclick="loadAreas()">刷新区域停复工台账</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>async function getJson(url,role){const r=await fetch(url,{headers:{'X-Actor':'demo','X-Role':role}});return await r.json()}
async function loadItems(){document.getElementById('out').textContent=JSON.stringify(await getJson('/api/items','viewer'),null,2)}
async function loadAreas(){const data=await getJson('/api/area-orders','viewer');const text=(data.orders||[]).map(o=>`停工单#${o.id} 区域${o.area_code} [${o.status==='stopped'?'停工中':'已复工'}] 范围:${o.scope==='whole_area'?'整片区域':'单台设备'} 班次:${o.affected_shifts.join('/')}\n当前原因:${o.current_reason}${o.blockers&&o.blockers.length?'\n复工阻断: '+o.blockers.join('；'):''}`).join('\n\n')||'暂无区域停工单';document.getElementById('out').textContent=text}</script></body></html>
